name: Weekly SPHEREx round

# Every Monday, build a "Fresh from SPHEREx" round from the newest data and
# open a pull request. A teammate checks the blink preview and merges it;
# Vercel then deploys the site with the new round.

on:
  schedule:
    - cron: "30 2 * * 1" # Monday 02:30 UTC = 08:00 in India
  workflow_dispatch: # "Run workflow" button on the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  build-round:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install the data pipeline
        run: pip install -r scripts/requirements.txt

      - name: Build this week's round
        run: python scripts/weekly_update.py --site site --work .work --review review

      - name: Open a pull request for review
        if: hashFiles('.work/weekly_report.md') != ''
        uses: peter-evans/create-pull-request@v6
        with:
          branch: weekly-spherex-round
          delete-branch: true
          commit-message: Add this week's SPHEREx round
          title: New SPHEREx round from this week's data
          body-path: .work/weekly_report.md
          add-paths: |
            site/public/levels
            site/public/objects
            review
